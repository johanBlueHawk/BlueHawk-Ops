<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#0f1d40" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>

    <!-- Hawk Wing / Shield Gradient -->
    <linearGradient id="hawkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ops Badge Gradient -->
    <linearGradient id="opsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Ambient Glow Arc -->
  <path d="M 24 16 Q 64 6 104 16" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Geometric Hawk / Wing Silhouette -->
  <g transform="translate(64, 44)">
    <!-- Left Wing Feathers -->
    <path d="M 0,-18 L -16,-2 L -32,-4 L -20,8 L -36,12 L -18,18 L 0,0 Z" fill="url(#hawkGrad)" />
    <!-- Right Wing Feathers -->
    <path d="M 0,-18 L 16,-2 L 32,-4 L 20,8 L 36,12 L 18,18 L 0,0 Z" fill="url(#hawkGrad)" />
    <!-- Center Beak / Core -->
    <polygon points="0,-22 5,-12 0,-7 -5,-12" fill="#ffffff" />
    <!-- Central Sensor Ping -->
    <circle cx="0" cy="1" r="2.5" fill="#38bdf8" />
  </g>

  <!-- "BHOps" Typography Line -->
  <g transform="translate(64, 98)">
    <!-- "BH" -->
    <text x="-16" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="23" fill="#ffffff" letter-spacing="-0.5px">BH</text>

    <!-- Ops Pill Background -->
    <rect x="2" y="-17" width="46" height="22" rx="7" fill="url(#opsGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />

    <!-- "Ops" Text -->
    <text x="25" y="-1" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="0.5px">Ops</text>

    <!-- Operational Green Dot -->
    <circle cx="44" cy="-14" r="2.5" fill="#10b981" />
  </g>
</svg>
