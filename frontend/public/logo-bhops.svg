<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <!-- Background Gradient for Icon Squircle -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="60%" stop-color="#0f1d40" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>

    <!-- Hawk Wing Gradient -->
    <linearGradient id="logoHawkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Ops Pill Gradient -->
    <linearGradient id="logoOpsPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Left: 44x44 Tech Icon -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#logoBgGrad)" stroke="url(#logoBorderGrad)" stroke-width="1.5" />
    
    <!-- Hawk Geometric Mark -->
    <g transform="translate(22, 22) scale(0.65)">
      <path d="M 0,-18 L -16,-2 L -32,-4 L -20,8 L -36,12 L -18,18 L 0,0 Z" fill="url(#logoHawkGrad)" />
      <path d="M 0,-18 L 16,-2 L 32,-4 L 20,8 L 36,12 L 18,18 L 0,0 Z" fill="url(#logoHawkGrad)" />
      <polygon points="0,-22 5,-12 0,-7 -5,-12" fill="#ffffff" />
      <circle cx="0" cy="1" r="2.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- Right: Typography & Operational Wordmark -->
  <g transform="translate(62, 0)">
    <!-- Brand Name: BLUE HAWK -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="17" fill="#ffffff" letter-spacing="1px">
      BLUE HAWK
    </text>

    <!-- Subtitle: TECHNOLOGIES -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="2.2px">
      TECHNOLOGIES
    </text>

    <!-- Ops Badge Pill -->
    <g transform="translate(136, 12)">
      <rect x="0" y="0" width="48" height="24" rx="7" fill="url(#logoOpsPillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="24" y="16.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-weight="800" font-size="12" fill="#ffffff" letter-spacing="0.5px">
        Ops
      </text>
      <!-- Active NOC Pulse Dot -->
      <circle cx="43" cy="5" r="2.5" fill="#10b981" />
    </g>
  </g>
</svg>
