version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhops-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PROJECT_NAME=Blue Hawk Ops API
      - VERSION=1.0.0
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=sqlite+aiosqlite:////app/data/blue_hawk_ops.db
      - SECRET_KEY=${SECRET_KEY:-bhops_super_secret_production_key_2026_jwt}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://ops.bluehawktech.com,http://ops.bluehawktech.com,http://179.52.197.80}
      - INVENTORY_API_URL=${INVENTORY_API_URL:-https://inventory.bluehawktech.com/api/v1}
      - INVENTORY_USERNAME=${INVENTORY_USERNAME:-bluehawk_ops}
      - INVENTORY_PASSWORD=${INVENTORY_PASSWORD:-}
      - ZAMMAD_HTTP_URL=${ZAMMAD_HTTP_URL:-https://support.bluehawktech.com}
      - ZAMMAD_API_TOKEN=${ZAMMAD_API_TOKEN:-}
      - ZAMMAD_DEFAULT_GROUP=${ZAMMAD_DEFAULT_GROUP:-Users}
      - ZAMMAD_CUSTOMER_EMAIL=${ZAMMAD_CUSTOMER_EMAIL:-johan@bluehawktech.com}
    volumes:
      - bhops_db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-https://ops.bluehawktech.com/api/v1}
    container_name: bhops-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-https://ops.bluehawktech.com/api/v1}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bhops_db_data:
    name: bhops_db_data
